name = "scout-analyst-pipeline"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Scheduled execution:
#   - */15 * * * *  : Ingestion scan + AI-managed Direct ATS discovery every 15 minutes
#   - 0 7 * * *     : Nightly Sleep Cycle at 03:00 AM America/La_Paz (07:00 UTC) — Market Pulse + 30d/60d Policy Watchdog
[triggers]
crons = ["*/15 * * * *", "0 7 * * *"]

# Cloudflare Workers AI binding (bge-m3 embeddings, bge-reranker-base, Llama 3.3 70B & Llama 3.1 8B)
[ai]
binding = "AI"

# Isolated SQLite Durable Object: Employer & Platform Reality KG + Bolivia Playbooks + Context Compiler
# (100% air-gapped inside scout-analyst-pipeline; zero cross-worker bindings)
[durable_objects]
bindings = [
  { name = "CAREER_BRAIN", class_name = "BoliviaCareerBrainDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoliviaCareerBrainDO"]

# Dedicated Cloudflare D1 SQL Database (`bolivia-remote-jobs-db`, region ENAM)
[[d1_databases]]
binding = "DB"
database_name = "bolivia-remote-jobs-db"
database_id = "78d17a8f-22ac-4b24-bd4b-bb2d359adfea"

# Dedicated 1024-dim Cloudflare Vectorize Indexes (`@cf/baai/bge-m3`, cosine)
[[vectorize]]
binding = "VECTORIZE"
index_name = "bolivia-remote-jobs-m3"

[[vectorize]]
binding = "INTEL_VECTORIZE"
index_name = "bolivia-remote-intel-m3"

# Private MCP Server Authentication (Fail-Closed by default):
# Set your private Bearer token in Cloudflare Secret Storage via:
#   npx wrangler secret put MCP_API_KEY
# All requests to /mcp, /api/mcp, and /.well-known/mcp.json require `Authorization: Bearer <MCP_API_KEY>`
# (or `X-MCP-API-Key: <MCP_API_KEY>` or `?key=<MCP_API_KEY>`).
[vars]
MCP_REQUIRE_AUTH = "true"

[observability]
enabled = true
